name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt-clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (lib)
        run: cargo clippy -p orchestrator --lib -- -D warnings
      - name: cargo clippy (tests)
        run: cargo clippy -p orchestrator --tests -- -D warnings

  test:
    name: test (offline-safe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: build sample-plugin (wasm32-wasip2)
        run: cargo build --locked -p sample-plugin --target wasm32-wasip2 --release
      - name: unit tests + integration tests (offline-safe subset)
        # per_module_capability_allows_matching_host is #[ignore] because
        # the guest calls https://example.com and TCP :80. It requires a
        # network-enabled runner. Offline-safe subset is the CI gate.
        run: cargo test --locked -p orchestrator -p wraith-sdk -p wraith-cli --all-targets

  build-musl-x86_64:
    name: build musl static (x86_64)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-x86_64
      - name: install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: build static musl
        run: cargo zigbuild --locked --release --target x86_64-unknown-linux-musl -p orchestrator
      - name: verify static linkage
        run: |
          file target/x86_64-unknown-linux-musl/release/orchestrator
          file target/x86_64-unknown-linux-musl/release/orchestrator | grep -q "statically linked"

  build-musl-aarch64:
    name: build musl static (aarch64)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-aarch64
      - name: install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: build static musl
        run: cargo zigbuild --locked --release --target aarch64-unknown-linux-musl -p orchestrator
      - name: verify static linkage
        run: |
          file target/aarch64-unknown-linux-musl/release/orchestrator
          file target/aarch64-unknown-linux-musl/release/orchestrator | grep -q "statically linked"

  build-sample-plugin:
    name: build sample-plugin (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sample-plugin
      - name: build sample
        run: cargo build --locked -p sample-plugin --target wasm32-wasip2 --release
      - name: verify wasm output
        run: |
          ls -lh target/wasm32-wasip2/release/*.wasm
          file target/wasm32-wasip2/release/*.wasm | grep -q "WebAssembly"
