set timeout=2
set envfile=(hd0,msdos1)/grub/grubenv
load_env -f ${envfile}
if [ "${ORDER}" = "B A" ]; then
    set default=1
elif [ "${ORDER}" = "A B" ]; then
    set default=0
else
    if [ "${slot}" = "B" ]; then set default=1; else set default=0; fi
fi
menuentry "WraithOS Slot A" --id "A" {
    set root=(hd0,msdos1)
    linux /bzImage dm-mod.create="wraith-verity,,,ro,0 @DEV_LEN@ verity 1 /dev/vda2 /dev/vda2 4096 4096 @DATA_BLOCKS@ @HASH_START@ sha256 @HASH_A@ @SALT_A@ 1 panic_on_corruption" root=/dev/dm-0 rootfstype=squashfs ro rootwait slot=A panic=5 softdog.soft_margin=15 console=ttyS0,115200 loglevel=3 quiet
}
menuentry "WraithOS Slot B" --id "B" {
    set root=(hd0,msdos1)
    linux /bzImage dm-mod.create="wraith-verity,,,ro,0 @DEV_LEN@ verity 1 /dev/vda3 /dev/vda3 4096 4096 @DATA_BLOCKS@ @HASH_START@ sha256 @HASH_B@ @SALT_B@ 1 panic_on_corruption" root=/dev/dm-0 rootfstype=squashfs ro rootwait slot=B panic=5 softdog.soft_margin=15 console=ttyS0,115200 loglevel=3 quiet
}
