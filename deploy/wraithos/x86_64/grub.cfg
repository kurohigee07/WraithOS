set timeout=2
set envfile=(hd0,msdos1)/grub/grubenv

load_env -f ${envfile}

# RAUC grub backend writes ORDER as "B A" or "A B"
# GRUB script syntax: use exact string compare, NO bash parameter expansion
if [ "${ORDER}" = "B A" ]; then
    set default=1
elif [ "${ORDER}" = "A B" ]; then
    set default=0
else
    if [ "${slot}" = "B" ]; then
        set default=1
    else
        set default=0
    fi
fi

menuentry "WraithOS Slot A" --id "A" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda2 rootfstype=squashfs ro slot=A panic=5 softdog.soft_margin=15 console=ttyS0,115200 loglevel=3 quiet
}

menuentry "WraithOS Slot B" --id "B" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda3 rootfstype=squashfs ro slot=B panic=5 softdog.soft_margin=15 console=ttyS0,115200 loglevel=3 quiet
}
