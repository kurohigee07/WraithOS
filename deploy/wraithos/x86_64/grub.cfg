set default=0
set timeout=3

# If boot_b marker exists, boot slot B; else slot A
if [ -f (hd0,msdos1)/boot_b ]; then
    set default=1
fi

menuentry "WraithOS Slot A" --id "A" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda2 rootfstype=squashfs slot=A panic=5 console=ttyS0,115200 loglevel=3 quiet
}

menuentry "WraithOS Slot B" --id "B" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda3 rootfstype=squashfs slot=B panic=5 console=ttyS0,115200 loglevel=3 quiet
}
