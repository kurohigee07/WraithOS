[system]
compatible=wraithos-x86_64
data-directory=/data
bootloader=grub
grubenv=/boot/grub/grubenv

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/vda2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/vda3
type=raw
bootname=B

[handlers]
slot-post-install=/usr/lib/rauc/slot-post-install
