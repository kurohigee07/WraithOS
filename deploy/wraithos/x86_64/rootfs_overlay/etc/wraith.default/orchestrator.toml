# Orchestrator runtime config.

db_path = "/var/lib/orchestrator/orchestrator.db"
modules_dir = "/modules"
data_dir = "/var/lib/orchestrator"
http_timeout_secs = 30
max_sockets = 256

# Keep below CPU count so tokio workers stay free.
max_concurrent_wasm = 2
wasm_acquire_timeout_secs = 10
wasm_memory_limit_mb = 256
max_db_connections = 8
log_level = "info"
log_format = "pretty"
metrics_bind = "127.0.0.1:9090"

enable_build = false
enable_build_network = false

trusted_signer_keys = []

[script]
inline = '''
log_info("rhai received: " + event_kind);
emit_event("rhai.processed", "{\"source\":\"rhai\"}");
'''
# path = "./rules/scan.rhai"

# Budget overrides:
# max_operations = 10000000
# max_string_size = 1048576
# max_array_size = 100000
# max_map_size = 10000
# max_expr_depth = 64
# max_function_expr_depth = 32

# If set, each .wasm requires a sibling .wasm.sig (ed25519).
# Per-tenant quota (0 = inherit / unlimited):
# [default_quota]
# max_memory_mb = 0
# max_concurrent = 0
# rate_limit_per_sec = 0

# Multi-tenant:
# default_tenant = "default"
# require_auth = true
# [tenants.alice]
# token_hash = "$argon2id$..."
# [tenants.bob]
# token_plain = "dev-token"

# cargo_home = "~/.cargo"

[[capabilities]]
type = "emit-event"
allowed_kinds = ["*"]

[[capabilities]]
type = "log"

[[capabilities]]
type = "http-get"
allowed_hosts = ["example.com"]

[[capabilities]]
type = "tcp-connect"
allowed_ports = [80, 443]
