image boot.vfat {
    vfat {
        label = "BOOT"
        files = {
            "bzImage",
            "grub"
        }
    }
    size = 64M
}

image wraithos.img {
    hdimage {
        partition-table-type = "dos"
    }

    partition boot {
        image = "boot.vfat"
        size = 64M
        partition-type = 0x0C
        bootable = true
        offset = 1M
    }

    partition rootfs-a {
        image = "rootfs.squashfs"
        size = 128M
        partition-type = 0x83
    }

    partition rootfs-b {
        image = "rootfs.squashfs"
        size = 128M
        partition-type = 0x83
    }

    partition data {
        size = 256M
        partition-type = 0x83
    }
}
