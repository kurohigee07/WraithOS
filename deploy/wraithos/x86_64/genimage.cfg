image boot.vfat {
    vfat {
        label = "BOOT"
        files = {
            "bzImage",
            "grub"
        }
    }
    size = 64M
}

image wraithos.img {
    hdimage {
        partition-table-type = "dos"
        # DOS partition table does not auto-pad the file to the last
        # partition's end when that partition has no image source
        # (p4 data is raw). Without an explicit size genimage stops
        # writing after p3 content, leaving p4 outside the file.
        # GPT (ARM) auto-pads, hence the asymmetry.
    }

    partition boot {
        image = "boot.vfat"
        size = 64M
        partition-type = 0x0C
        bootable = true
        offset = 1M
    }

    partition rootfs-a {
        image = "rootfs.squashfs"
        size = 128M
        partition-type = 0x83
    }

    partition rootfs-b {
        image = "rootfs.squashfs"
        size = 128M
        partition-type = 0x83
    }

    partition data {
        size = 256M
        partition-type = 0x83
    }
}
