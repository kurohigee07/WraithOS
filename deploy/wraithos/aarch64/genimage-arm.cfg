image boot.vfat {
    vfat {
        label = "BOOT"
        files = {
            "Image-a",
            "Image-b",
            "EFI",
            "grub"
        }
    }
    size = 200M
}

image wraithos-arm.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        image = "boot.vfat"
        size = 200M
        partition-type-uuid = "U"
        bootable = true
        offset = 1M
    }

    partition rootfs-a {
        image = "rootfs-verity.squashfs"
        size = 64M
        partition-type-uuid = "L"
    }

    partition rootfs-b {
        image = "rootfs-verity.squashfs"
        size = 64M
        partition-type-uuid = "L"
    }

    partition data {
        size = 128M
        partition-type-uuid = "L"
    }

}
