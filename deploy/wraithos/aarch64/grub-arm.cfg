set timeout=2
set envfile=(hd0,gpt1)/grub/grubenv

load_env -f ${envfile}

if [ -z "${slot}" ]; then set slot=A; fi
if [ -z "${tries}" ]; then set tries=0; fi
if [ -z "${good}" ]; then set good=1; fi
if [ -z "${lkg}" ]; then set lkg=A; fi
if [ "${slot}" != "A" ]; then
    if [ "${slot}" != "B" ]; then set slot=A; fi
fi
if [ "${lkg}" != "A" ]; then
    if [ "${lkg}" != "B" ]; then set lkg=A; fi
fi

if [ "${tries}" != "0" ]; then
    set booted=${slot}
    if [ "${tries}" = "3" ]; then
        set tries=2
    elif [ "${tries}" = "2" ]; then
        set tries=1
    elif [ "${tries}" = "1" ]; then
        set tries=0
    else
        set tries=0
    fi
    save_env -f ${envfile} tries booted
else
    if [ "${good}" != "1" ]; then
        set slot=${lkg}
        set good=1
        set tries=0
        set booted=${slot}
        save_env -f ${envfile} slot good tries booted
    fi
fi

if [ "${slot}" = "B" ]; then
    set default=1
else
    set default=0
fi

menuentry "WraithOS ARM Slot A" --id "A" {
    set root=(hd0,gpt1)
    linux /Image-a root=/dev/vda2 rootfstype=squashfs ro slot=A panic=5 softdog.soft_margin=15 console=ttyAMA0
}

menuentry "WraithOS ARM Slot B" --id "B" {
    set root=(hd0,gpt1)
    linux /Image-b root=/dev/vda3 rootfstype=squashfs ro slot=B panic=5 softdog.soft_margin=15 console=ttyAMA0
}
