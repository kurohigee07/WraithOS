set default=0
set timeout=3

# Load RAUC env (ORDER variable = boot priority)
if [ -f (hd0,msdos1)/grub/grubenv ]; then
    load_env -f (hd0,msdos1)/grub/grubenv
fi

menuentry "WraithOS Slot A" --id "A" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda2 rootfstype=squashfs rauc.slot=A panic=5 console=ttyS0 loglevel=7
}

menuentry "WraithOS Slot B" --id "B" {
    set root=(hd0,msdos1)
    linux /bzImage root=/dev/vda3 rootfstype=squashfs rauc.slot=B panic=5 console=ttyS0 loglevel=7
}

# ORDER="B A" = boot B dulu, "A B" = boot A dulu
if [ "${ORDER}" = "B A" ]; then
    set default=1
fi
