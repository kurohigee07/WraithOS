set default=0
set timeout=3

if [ -f (hd0,gpt1)/boot_b ]; then
    set default=1
fi

menuentry "WraithOS ARM Slot A" --id "A" {
    set root=(hd0,gpt1)
    linux /Image-a root=/dev/vda2 rootfstype=squashfs ro slot=A panic=5 console=ttyAMA0
}

menuentry "WraithOS ARM Slot B" --id "B" {
    set root=(hd0,gpt1)
    linux /Image-b root=/dev/vda3 rootfstype=squashfs ro slot=B panic=5 console=ttyAMA0
}
