[workspace]
members = ["orchestrator", "shared-types", "sample-plugin", "evil-plugin", "wraith-sdk", "wraith-cli"]
default-members = ["orchestrator", "shared-types", "wraith-cli", "wraith-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
dashmap = "6.1"

thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# rustls only, no native-tls, no aws-lc-rs
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider", "json", "gzip", "brotli", "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring", "std", "tls12", "logging",
] }

socket2 = { version = "0.5", features = ["all"] }

# sqlite-bundled, static
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "sqlite", "macros", "migrate",
] }

# wasmtime LTS; async host needs component-model-async
wasmtime = { version = "48.0", default-features = false, features = [
    "async", "component-model", "component-model-async", "cranelift", "runtime", "std",
] }
wasmtime-wasi = { version = "48.0", default-features = false, features = ["p2"] }

rhai = { version = "1.22", features = ["sync", "serde", "internals"] }

axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["timeout"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
argon2 = { version = "0.5", features = ["std"] }
tempfile = "3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webpki-roots = "1.0"

tar = "0.4"
flate2 = "1.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
