<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">Wraith</title><desc id="desc">Rust, WebAssembly, and an appliance operating system.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#242333" stroke-width=".6"/></pattern><linearGradient id="line"><stop stop-color="#9d4edd"/><stop offset="1" stop-color="#3a86ff"/></linearGradient></defs><rect width="1200" height="260" rx="16" fill="#0c0b12"/><rect width="1200" height="260" rx="16" fill="url(#grid)"/><path d="M760 130H865M965 130H1070" stroke="url(#line)" stroke-width="2"/><g fill="#14121f" stroke="#454052"><rect x="710" y="98" width="60" height="64" rx="10"/><rect x="865" y="82" width="100" height="96" rx="14" stroke="#9d4edd"/><rect x="1070" y="98" width="60" height="64" rx="10"/></g><g fill="#a9a5bb" font-family="monospace" font-size="14" text-anchor="middle"><text x="740" y="135">HTTP</text><text x="915" y="127" fill="#f8f9fa">WASM</text><text x="915" y="148" font-size="10">SANDBOX</text><text x="1100" y="135">JSON</text></g><circle cx="815" cy="130" r="4" fill="#9d4edd"/><circle cx="1018" cy="130" r="4" fill="#3a86ff"/><text x="64" y="66" fill="#9d4edd" font-family="monospace" font-size="13" letter-spacing="4">RUNTIME + APPLIANCE OS</text><text x="58" y="153" fill="#f8f9fa" font-family="Arial,sans-serif" font-size="84" font-weight="700" letter-spacing="-3">WRAITH</text><text x="64" y="198" fill="#aaa6ba" font-family="Arial,sans-serif" font-size="21">Small components. Explicit boundaries. One Rust runtime.</text><rect x="64" y="222" width="160" height="3" rx="1.5" fill="url(#line)"/></svg>
