<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">WraithOS boot and persistence flow</title><desc id="desc">Firmware and GRUB select a root slot. Linux mounts the read-only root, BusyBox initializes temporary filesystems, ARM publishes boot state and starts the watchdog, persistent data is mounted, optional DHCP runs, and the host starts. ARM health proof can commit the trial slot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b7aa3"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#f8f9fa}.label{font-size:11px;fill:#c490f3;letter-spacing:1.5px}.node{fill:#17131f;stroke:#3b334b;rx:8}.title{font-size:16px;font-weight:600}.sub{font-size:11px;fill:#a9a5ba}.edge{fill:none;stroke:#8b7aa3;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="470" rx="12" fill="#100e18"/><text x="30" y="34" class="label">FIRMWARE → USERSPACE</text>
<rect x="30" y="55" width="240" height="76" class="node"/><text x="48" y="82" class="title">BIOS / ARM UEFI</text><text x="48" y="103" class="sub">architecture-specific firmware</text><text x="48" y="120" class="sub">not verified boot by default</text>
<rect x="310" y="55" width="240" height="76" class="node" style="stroke:#3a86ff"/><text x="328" y="82" class="title">GRUB selects A / B</text><text x="328" y="103" class="sub">x86: boot_b marker</text><text x="328" y="120" class="sub">ARM: tries / good / lkg</text>
<rect x="590" y="55" width="240" height="76" class="node"/><text x="608" y="82" class="title">Linux + read-only root</text><text x="608" y="103" class="sub">SquashFS root slot</text><text x="608" y="120" class="sub">slot=A/B on cmdline</text>
<rect x="870" y="55" width="220" height="76" class="node"/><text x="888" y="82" class="title">BusyBox init</text><text x="888" y="103" class="sub">inittab + init.d scripts</text><text x="888" y="120" class="sub">proc / sys / dev / tmpfs</text>
<path class="edge" d="M270 93H310M550 93H590M830 93H870"/>
<rect x="870" y="180" width="220" height="76" class="node" style="stroke:#3a86ff"/><text x="888" y="207" class="title">ARM boot state</text><text x="888" y="228" class="sub">S05 publishes slot/env</text><text x="888" y="245" class="sub">watchdog grace begins</text>
<rect x="590" y="180" width="240" height="76" class="node" style="stroke:#67d6a3"/><text x="608" y="207" class="title">S30 persistent data</text><text x="608" y="228" class="sub">/data → DB / modules / config</text><text x="608" y="245" class="sub">LUKS unlock when configured</text>
<rect x="310" y="180" width="240" height="76" class="node"/><text x="328" y="207" class="title">S41 optional network</text><text x="328" y="228" class="sub">best-effort en* DHCP</text><text x="328" y="245" class="sub">not full wizard integration</text>
<rect x="30" y="180" width="240" height="76" class="node" style="stroke:#9d4edd;fill:#24152f"/><text x="48" y="207" class="title">S99 wraith-init</text><text x="48" y="228" class="sub">same Rust orchestrator</text><text x="48" y="245" class="sub">127.0.0.1:9090</text>
<path class="edge" d="M980 131V180M870 218H830M590 218H550M310 218H270"/>
<rect x="30" y="305" width="240" height="76" class="node"/><text x="48" y="332" class="title">Health + proof</text><text x="48" y="353" class="sub">process · HTTP · env · mounts</text><text x="48" y="370" class="sub">ARM data write/remove check</text>
<rect x="310" y="305" width="240" height="76" class="node" style="stroke:#67d6a3"/><text x="328" y="332" class="title">Commit trial</text><text x="328" y="353" class="sub">good=1 · tries=0 · lkg=slot</text><text x="328" y="370" class="sub">only after successful proof</text>
<rect x="590" y="305" width="500" height="76" class="node" style="stroke:#e8bb72"/><text x="608" y="332" class="title">Failure / exhaustion</text><text x="608" y="353" class="sub">ARM: watchdog demotion or next-boot LKG fallback</text><text x="608" y="370" class="sub">x86: manual marker rollback; no automatic trial counter</text>
<path class="edge" d="M150 256V305M270 343H310M550 343H590"/>
<rect x="30" y="410" width="1060" height="34" rx="6" fill="#21172b"/><text x="48" y="432" class="sub">Read wraithos.md before updating block devices. The interactive boot lab models GRUB counters, not watchdog timing or power-loss safety.</text>
</svg>
