<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Wraith request and event architecture</title><desc id="desc">A client reaches the Axum router, authentication, registry, tenant and module gates, and the global pool. A fresh Store runs the component. Host imports reach HTTP, TCP, and events. Results feed SQLite audit and Prometheus metrics. Events also reach Rhai, WebSocket, and Rust subscribers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b7aa3"/></marker><style>text{font-family:Inter,system-ui,sans-serif;fill:#f8f9fa}.label{font-size:11px;fill:#c490f3;letter-spacing:1.5px}.node{fill:#17131f;stroke:#3b334b;rx:8}.title{font-size:16px;font-weight:600}.sub{font-size:11px;fill:#a9a5ba}.edge{fill:none;stroke:#8b7aa3;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="650" rx="12" fill="#100e18"/>
<text x="30" y="34" class="label">REQUEST PATH</text>
<rect x="30" y="55" width="200" height="66" class="node"/><text x="48" y="82" class="title">Client</text><text x="48" y="103" class="sub">curl / SDK / CLI · JSON</text>
<rect x="270" y="55" width="220" height="66" class="node"/><text x="288" y="82" class="title">Axum + auth</text><text x="288" y="103" class="sub">60 s outer HTTP timeout</text>
<rect x="530" y="55" width="240" height="66" class="node"/><text x="548" y="82" class="title">Module registry</text><text x="548" y="103" class="sub">(tenant, module ID) → Arc</text>
<rect x="810" y="55" width="280" height="66" class="node"/><text x="828" y="82" class="title">Tenant gates</text><text x="828" y="103" class="sub">rate token → concurrency permit</text>
<path class="edge" d="M230 88H270M490 88H530M770 88H810"/>
<rect x="810" y="170" width="280" height="66" class="node"/><text x="828" y="197" class="title">Module gates</text><text x="828" y="218" class="sub">rate token → concurrency permit</text>
<rect x="530" y="170" width="240" height="66" class="node"/><text x="548" y="197" class="title">Global Wasm pool</text><text x="548" y="218" class="sub">permit ≠ cached instance</text>
<rect x="270" y="170" width="220" height="66" class="node" style="stroke:#9d4edd"/><text x="288" y="197" class="title">Fresh Store</text><text x="288" y="218" class="sub">WASI · limits · epoch deadline</text>
<rect x="30" y="170" width="200" height="66" class="node" style="stroke:#9d4edd;fill:#24152f"/><text x="48" y="197" class="title">Component.run</text><text x="48" y="218" class="sub">JSON string → JSON string</text>
<path class="edge" d="M950 121V170M810 203H770M530 203H490M270 203H230"/>
<text x="30" y="286" class="label">EXPLICIT WIT HOST IMPORTS</text>
<rect x="30" y="307" width="200" height="76" class="node"/><text x="48" y="334" class="title">HTTP GET</text><text x="48" y="355" class="sub">hostname allowlist</text><text x="48" y="372" class="sub">reqwest · no redirects</text>
<rect x="270" y="307" width="220" height="76" class="node"/><text x="288" y="334" class="title">Raw TCP</text><text x="288" y="355" class="sub">port allowlist</text><text x="288" y="372" class="sub">module-ID-owned handles</text>
<rect x="530" y="307" width="240" height="76" class="node"/><text x="548" y="334" class="title">EventBus</text><text x="548" y="355" class="sub">broadcast(1024)</text><text x="548" y="372" class="sub">in-memory · lossy on lag</text>
<path class="edge" d="M130 236V307M130 260H380V307M380 260H650V307"/>
<rect x="810" y="307" width="280" height="76" class="node"/><text x="828" y="334" class="title">Subscribers</text><text x="828" y="355" class="sub">Rhai worker · WebSocket · Rust</text><text x="828" y="372" class="sub">Rhai can emit non-self events</text>
<path class="edge" d="M770 345H810M950 383V410H650V383"/>
<text x="30" y="446" class="label">RESULT + OBSERVABILITY</text>
<rect x="30" y="467" width="200" height="76" class="node"/><text x="48" y="494" class="title">Parse JSON result</text><text x="48" y="515" class="sub">inside execution timer</text><text x="48" y="532" class="sub">guest Err / trap → error</text>
<rect x="270" y="467" width="220" height="76" class="node"/><text x="288" y="494" class="title">SQLite audit</text><text x="288" y="515" class="sub">integer milliseconds</text><text x="288" y="532" class="sub">insert errors ignored</text>
<rect x="530" y="467" width="240" height="76" class="node"/><text x="548" y="494" class="title">Prometheus</text><text x="548" y="515" class="sub">counters + duration histogram</text><text x="548" y="532" class="sub">pool wait measured separately</text>
<rect x="810" y="467" width="280" height="76" class="node"/><text x="828" y="494" class="title">HTTP JSON response</text><text x="828" y="515" class="sub">decoded value, not an envelope</text><text x="828" y="532" class="sub">status depends on failure path</text>
<path class="edge" d="M130 383V467M230 505H270M490 505H530M770 505H810"/>
<rect x="30" y="580" width="1060" height="42" rx="6" fill="#21172b"/><text x="48" y="606" class="sub">Teaching simplification: arrows show ownership/flow, not exact timing. Read architecture.md for gate order, timer scope, and cleanup limitations.</text>
</svg>
